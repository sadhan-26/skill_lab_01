<section class="auth-page">
  <div class="auth-copy">
    <p class="eyebrow">Register your workspace</p>
    <h1>Bring your<br><span>team together.</span></h1>
    <p>Set up your workspace details so your team can start moving with clarity.</p>
  </div>
  <form class="auth-form" [formGroup]="registrationForm" (ngSubmit)="submit()" novalidate>
    <label for="registration-company">Workspace name</label>
    <input id="registration-company" type="text" placeholder="My team" formControlName="workspaceName" [class.invalid]="registrationForm.controls.workspaceName.touched && registrationForm.controls.workspaceName.invalid">
    <small class="field-error" *ngIf="registrationForm.controls.workspaceName.touched && registrationForm.controls.workspaceName.hasError('required')">Workspace name is required.</small>
    <small class="field-error" *ngIf="registrationForm.controls.workspaceName.touched && registrationForm.controls.workspaceName.hasError('minlength')">Enter at least 2 characters.</small>
    <label for="registration-email">Work email</label>
    <input id="registration-email" type="email" placeholder="you@company.com" formControlName="email" [class.invalid]="registrationForm.controls.email.touched && registrationForm.controls.email.invalid">
    <small class="field-error" *ngIf="registrationForm.controls.email.touched && registrationForm.controls.email.hasError('required')">Work email is required.</small>
    <small class="field-error" *ngIf="registrationForm.controls.email.touched && registrationForm.controls.email.hasError('email')">Enter a valid email address.</small>
    <label for="registration-size">Team size</label>
    <select id="registration-size" formControlName="teamSize" [class.invalid]="registrationForm.controls.teamSize.touched && registrationForm.controls.teamSize.invalid">
      <option value="">Choose a team size</option>
      <option value="solo">Just me</option>
      <option>2 - 10 people</option>
      <option>11 - 50 people</option>
      <option>51+ people</option>
    </select>
    <small class="field-error" *ngIf="registrationForm.controls.teamSize.touched && registrationForm.controls.teamSize.hasError('required')">Choose a team size.</small>
    <button class="auth-submit" type="submit">Register workspace <span aria-hidden="true">&#8594;</span></button>
    <p class="form-success" *ngIf="submitted && registrationForm.valid">Your workspace is ready to create.</p>
  </form>
</section>
